name: Godot project smoke check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          sudo ln -sf /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Import and parse project
        run: godot --headless --editor --path . --quit

      - name: Run gameplay smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/ci_smoke_test.gd 2>&1 | tee /tmp/phoenix-smoke.log
          grep -q "PHOENIX_SMOKE_TEST_OK" /tmp/phoenix-smoke.log
          if grep -Eq "SMOKE TEST:|SCRIPT ERROR:|Parse Error:" /tmp/phoenix-smoke.log; then
            echo "Godot reported a smoke-test or script error."
            exit 1
          fi
