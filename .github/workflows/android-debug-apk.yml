name: Android debug APK

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-debug:
    name: Export Android arm64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${RUNNER_TEMP}/android-sdk"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          curl --location --fail --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            --output /tmp/android-command-line-tools.zip
          mkdir -p /tmp/android-command-line-tools "${ANDROID_HOME}/cmdline-tools/latest"
          unzip -q /tmp/android-command-line-tools.zip -d /tmp/android-command-line-tools
          cp -a /tmp/android-command-line-tools/cmdline-tools/. "${ANDROID_HOME}/cmdline-tools/latest/"

      - name: Install Godot-supported Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Install Godot 4.7.2 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2-stable"
          curl --location --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          sudo ln -sf "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot

          curl --location --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" \
            --output /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          TEMPLATE_FILE="$(find /tmp/godot-templates -type f -name android_debug.apk -print -quit)"
          test -n "${TEMPLATE_FILE}"
          TEMPLATE_DIR="${HOME}/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "${TEMPLATE_DIR}"
          cp -a "$(dirname "${TEMPLATE_FILE}")/." "${TEMPLATE_DIR}/"

      - name: Configure Godot Android SDK paths and temporary debug key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/godot" "${HOME}/.android"
          cat > "${HOME}/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          EOF

          keytool -genkeypair -noprompt -v \
            -keystore "${HOME}/.android/phoenix-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Project Phoenix,C=US"

      - name: Import project and export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --editor --path . --quit
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH="${HOME}/.android/phoenix-debug.keystore" \
            GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey \
            GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android \
            godot --headless --path . --export-debug "Android Debug" build/android/phoenix-debug.apk
          test -s build/android/phoenix-debug.apk
          unzip -t build/android/phoenix-debug.apk >/dev/null
          file build/android/phoenix-debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: project-phoenix-android-debug-apk
          path: build/android/phoenix-debug.apk
          if-no-files-found: error
          retention-days: 7
